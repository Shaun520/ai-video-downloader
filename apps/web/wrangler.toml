# Cloudflare Worker 部署配置 —— SaveAny Web（Next.js via OpenNext）
# 前置：pnpm --filter web add -D @opennextjs/cloudflare
#       pnpm --filter web exec opennextjs-cloudflare build   → 生成 .open-next/
# 发布：wrangler deploy
# 说明：Next.js 的 /api/* 与 SSE 由 Worker 承载；
#       需要 yt-dlp/ffmpeg 的核心能力由 Cloudflare Containers 的 @saveany/container 提供。

name = "saveany-web"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

main = ".open-next/worker.js"

# 静态资源（OpenNext 产物）
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Worker 自引用绑定（OpenNext 增量缓存/ISR 所需，service 需与 name 一致）
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "saveany-web"

# 常规变量（敏感密钥请用 wrangler secret put 配置）
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://xxx.supabase.co"

# 以下用 Secret 注入（勿写入仓库）：
# NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, DEEPSEEK_API_KEY,
# DASHSCOPE_API_KEY,
# NEXT_PUBLIC_APP_URL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# STRIPE_PRICE_ID_MONTHLY, STRIPE_PRICE_ID_YEARLY